<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game Balance Evaluator</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        textarea, input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            background-color: #eee;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Board Game Balance Evaluator</h1>
        <form id="game-form">
            <label for="difficulty">Difficulty:</label>
            <input type="text" id="difficulty" name="difficulty" value="매우 쉬움">

            <label for="player_count">Player Count:</label>
            <input type="text" id="player_count" name="player_count" value="2-6인">

            <label for="main_objectives">Main Objectives (comma-separated):</label>
            <textarea id="main_objectives" name="main_objectives">끝없는 보물 상자를 계속 탐색,시간이 멈춘 탑에서 단서 수집</textarea>

            <label for="rules">Rules (comma-separated):</label>
            <textarea id="rules" name="rules">플레이어는 매 턴 이동 또는 조사 중 선택,턴 제한 없음, 덱도 리필됨,플레이어는 절대 죽지 않음 (체력 무한),적은 매턴 등장하지만 피해를 주지 않음,유물은 항상 숨겨진 위치로 이동하여 절대 찾을 수 없음</textarea>

            <label for="win_conditions">Win Conditions (comma-separated):</label>
            <textarea id="win_conditions" name="win_conditions">탑 안의 10개의 유물을 모두 수집하면 승리</textarea>

            <label for="fail_conditions">Fail Conditions (comma-separated):</label>
            <textarea id="fail_conditions" name="fail_conditions">전원이 게임을 포기함</textarea>

            <button type="submit">Evaluate</button>
        </form>
        <h2>Result:</h2>
        <pre id="result"></pre>
    </div>

    <script>
        document.getElementById('game-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const data = {
                difficulty: formData.get('difficulty'),
                player_count: formData.get('player_count'),
                main_objectives: formData.get('main_objectives').split(','),
                rules: formData.get('rules').split(','),
                win_conditions: formData.get('win_conditions').split(','),
                fail_conditions: formData.get('fail_conditions').split(',')
            };

            const response = await fetch('/evaluate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            document.getElementById('result').textContent = JSON.stringify(result, null, 2);
        });
    </script>
</body>
</html>
