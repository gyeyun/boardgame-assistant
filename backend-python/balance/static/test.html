<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>보드게임 밸런스 평가</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
      max-width: 800px;
    }
    h1 {
      font-size: 1.8em;
    }
    textarea, input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
    }
    .result {
      margin-top: 30px;
      padding: 15px;
      background: #f9f9f9;
      border-left: 4px solid #007BFF;
    }
    .label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>보드게임 밸런스 평가 도구</h1>
  
  <label>난이도</label>
  <input type="text" id="difficulty" placeholder="예: 보통" />

  <label>인원</label>
  <input type="text" id="player_count" placeholder="예: 2~4인" />

  <label>주요 목표 (쉼표로 구분)</label>
  <input type="text" id="main_objectives" placeholder="예: 유물 수집, 보스 처치" />

  <label>행동 규칙 (쉼표로 구분)</label>
  <input type="text" id="rules" placeholder="예: 턴제 진행, 이동 후 탐색 가능" />

  <label>승리 조건 (쉼표로 구분)</label>
  <input type="text" id="win_conditions" placeholder="예: 유물 3개 수집" />

  <label>패배/탈락 조건 (쉼표로 구분)</label>
  <input type="text" id="fail_conditions" placeholder="예: 턴 종료 시 유물 0개" />

  <button onclick="submitForm()">밸런스 평가하기</button>

  <div class="result" id="result" style="display: none;"></div>

  <script>
   async function submitForm() {
    const data = {
        difficulty: document.getElementById("difficulty").value,
        player_count: document.getElementById("player_count").value,
        main_objectives: document.getElementById("main_objectives").value.split(',').map(s => s.trim()),
        rules: document.getElementById("rules").value.split(',').map(s => s.trim()),
        win_conditions: document.getElementById("win_conditions").value.split(',').map(s => s.trim()),
        fail_conditions: document.getElementById("fail_conditions").value.split(',').map(s => s.trim())
    };
    console.log("Request URL: /api/feedback/balance");
    console.log("Request data:", JSON.stringify(data, null, 2));
    try {
        const response = await fetch('/api/feedback/balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        console.log("Response status:", response.status);
        const result = await response.json();
        console.log("Response data:", result);
        displayResult(result.balanceAnalysis);
    } catch (error) {
        console.error("Request failed:", error);
    }
}
    function displayResult(analysis) {
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `
        <p><span class="label">🧠 시뮬레이션 요약:</span><br>${analysis.simulationSummary}</p>
        <p><span class="label">⚠️ 문제점 감지:</span><br><ul>${analysis.issuesDetected.map(i => `<li>${i}</li>`).join('')}</ul></p>
        <p><span class="label">🔧 개선 제안:</span><br><ul>${analysis.recommendations.map(r => `<li>${r}</li>`).join('')}</ul></p>
        <p><span class="label">📊 밸런스 점수:</span> ${analysis.balanceScore} / 10</p>
      `;
      resultDiv.style.display = "block";
    }
  </script>
</body>
</html>
