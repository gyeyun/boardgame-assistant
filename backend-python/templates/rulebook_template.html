<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: sans-serif; padding: 40px; }
    h1, h2 { color: #333; }
    .section { margin-bottom: 30px; }
    .section h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    .section p { white-space: pre-line; }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <div class="section"><h2>1. 게임 소개</h2><p>{{ intro }}</p></div>
  <div class="section"><h2>2. 구성품</h2><p>{{ components }}</p></div>
  <div class="section"><h2>3. 적정 연령</h2><p>{{ age }}</p></div>
  <div class="section"><h2>4. 게임 준비</h2><p>{{ setup }}</p></div>
  <div class="section"><h2>5. 게임 규칙</h2><p>{{ rule_set }}</p></div>
  <div class="section"><h2>6. 게임 진행 방식</h2><p>{{ progress }}</p></div>
  <div class="section"><h2>7. 승리 조건</h2><p>{{ win_condition }}</p></div>
  <div class="section"><h2>8. 턴 순서</h2><p>{{ turn_order }}</p></div>
</body>
</html>
